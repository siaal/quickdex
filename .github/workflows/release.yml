# Every push to main: analyze + test, build Android/Linux/Windows, publish release
# v1.0.<run number>. Android versionCode is the commit count, matching `make install`.
# Python data tests are not run here: they need the PokéAPI source cache (`make data`);
# the generated assets they produce are committed.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.fvm.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    environment: sdf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit count = versionCode
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter }}
          channel: stable
          cache: true
      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties
      - run: >
          flutter build apk --release
          --build-name="$VERSION" --build-number="$(git rev-list --count HEAD)"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "quickdex-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: quickdex-*-android.apk

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter build linux --release --build-name="$VERSION"
      - run: tar -czf "quickdex-$VERSION-linux-x64.tar.gz" -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: quickdex-*-linux-x64.tar.gz

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.check.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter build windows --release --build-name="$env:VERSION"
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "quickdex-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: quickdex-*-windows-x64.zip

  release:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "QuickDex $VERSION" --generate-notes
